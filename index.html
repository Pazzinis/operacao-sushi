:root{color-scheme:dark;--bg:#171c18;--paper:#f7f3e8;--ink:#20251f;--lime:#d7f879;--muted:#a5ad9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Arial,Helvetica,sans-serif;font-size:17px;min-height:100svh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#a5ad9f .7px,transparent .7px);background-size:13px 13px}main{position:relative;max-width:460px;margin:auto;padding:26px 25px 20px;min-height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:2px;font-weight:700}.brand{display:flex;align-items:center;gap:9px}.brand b{font-size:24px;letter-spacing:0}.tag{border:1px solid #68705e;padding:7px 9px;border-radius:5px;font-size:11px;transform:rotate(5deg);color:var(--lime)}.progress{display:flex;gap:6px;margin-top:24px}.progress span{height:3px;background:#3a4235;flex:1;border-radius:3px}.progress .done{background:var(--lime)}#screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0;animation:enter .32s ease}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--lime);text-transform:uppercase;margin:0 0 15px}h1{font-size:clamp(36px,10.5vw,49px);line-height:1.02;letter-spacing:-2px;margin:0 0 20px;font-weight:900}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--lime)}p{line-height:1.5;margin:0 0 20px;color:#c9cdbf}.art{height:170px;position:relative;display:grid;place-items:center;margin:0 0 23px}.plate{width:173px;height:142px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 10px #d9ddc9,inset 0 0 0 13px #b6bda6,8px 13px 0 #0e120f;transform:rotate(-12deg);display:flex;align-items:center;justify-content:center;font-size:62px;letter-spacing:-20px;padding-right:18px}.stick{position:absolute;right:44px;top:0;font-family:Georgia,serif;color:var(--ink);background:var(--lime);font-size:17px;padding:12px 13px;border-radius:50%;transform:rotate(12deg);line-height:1.1;box-shadow:3px 4px 0 #0e120f}.scribble{position:absolute;bottom:0;left:10px;font-family:Georgia,serif;font-style:italic;font-size:16px;transform:rotate(-9deg)}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:12px;min-height:54px;padding:15px 18px;font-weight:700;background:var(--lime);color:var(--ink);width:100%;transition:transform .18s,background .18s}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid white;outline-offset:4px}.secondary{background:transparent;border:1px solid #65705d;color:var(--paper);margin-top:11px}.small{font-size:14px;background:transparent;color:var(--muted);font-weight:400;min-height:44px;padding:12px 0}.note{font-size:13px;text-align:center;color:var(--muted);margin:13px 0 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:3px 0 20px}.choice{background:#252e24;color:var(--paper);border:1px solid #56614c;min-height:125px;font-size:15px;position:relative}.choice span{display:block;font-size:34px;margin-bottom:9px}.choice[aria-pressed=true]{border:2px solid var(--lime);background:#35432b}.choice[aria-pressed=true]:after{content:'✓';position:absolute;right:10px;top:7px;color:var(--lime)}.message{border-left:3px solid var(--lime);padding:14px 16px;background:#252e24;margin:17px 0;line-height:1.5}.arena{min-height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden}.arena button{width:150px;margin:0}.argument{background:var(--paper);color:var(--ink);padding:22px;border-radius:5px;transform:rotate(-2deg);margin:5px 0 28px;box-shadow:6px 7px 0 #090e09}.argument p{color:var(--ink);margin:0 0 14px;font-size:22px;font-weight:bold}.argument p:last-child{margin:0}.argument small{font-size:14px;font-weight:normal}.receipt{background:var(--paper);color:var(--ink);padding:27px 23px 31px;margin:0 0 25px;position:relative;transform:rotate(-1deg);box-shadow:5px 6px 0 #0c100c}.receipt:after{content:'';position:absolute;bottom:-8px;left:0;right:0;height:10px;background:linear-gradient(135deg,var(--paper) 5px,transparent 0) 0 0/12px 10px,linear-gradient(225deg,var(--paper) 5px,transparent 0) 0 0/12px 10px}.receipt h2{text-align:center;font-size:25px;margin:0 0 8px}.receipt .sub{text-align:center;font-family:monospace;font-size:13px;letter-spacing:1px}.receipt p{color:var(--ink);font-size:15px;margin:13px 0}.rule{border-top:1px dashed #858779;margin:17px 0}.stamp{display:table;margin:20px auto 0;border:2px solid #46723b;padding:7px 12px;color:#46723b;transform:rotate(-7deg);font-weight:900;font-size:18px}.bigemoji{font-size:85px;margin-bottom:22px}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #394233;padding-top:17px;font-size:12px;color:var(--muted)}.footer button{width:auto;padding:0;min-height:32px;font-size:12px;background:transparent;color:var(--muted);font-weight:normal}.confetti{position:fixed;top:-60px;pointer-events:none;font-size:27px;animation:fall 3s linear forwards;z-index:10}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(110vh) rotate(450deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}@media(min-width:650px){main{margin:28px auto;min-height:840px;border:1px solid #3b4534;border-radius:24px;padding:30px;box-shadow:0 20px 100px #090d0990}body{background:#101510}}

body{background:#101510 url('mosaic.png') center/cover fixed}body:before{background:#101510;opacity:.62}main{background:rgba(23,28,24,.93)}

<body><main><header><div class="brand"><b>✳</b> OPERAÇÃO SUSHI</div><div class="tag">MUITO SUSPEITO</div></header><nav class="progress" aria-label="Progresso"></nav><section id="screen" aria-live="polite"></section><footer class="footer"><span>feito com segundas intenções.<br>e fome. muita fome.</span><button id="restart">recomeçar</button></footer></main>
<script>
let typingTimer;let step=0,noCount=0;const screen=document.querySelector('#screen'),progress=document.querySelector('.progress');
function button(text,action,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls+(cls==='small'?'':' spoken');b.onclick=action;screen.append(b);return b}
function show(n){screen.classList.remove('photo-scene');clearTimeout(typingTimer);step=n;progress.innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<=n?'done':''}"></span>`).join('');screen.innerHTML='';screen.style.animation='none';void screen.offsetWidth;screen.style.animation='';
if(n===0){screen.innerHTML='<div class="art" aria-hidden="true"><img class="sushi-art" src="sushi.svg" alt=""><div class="stick">100%<br>interesse</div><div class="scribble">isso aqui é uma indireta...</div></div><p class="eyebrow">Carol, esse site é pra ti</p><h1>Tem um negócio<br>entre <em>nós dois.</em></h1><p>Espero que seja uma mesa.<br>Com bastante sushi em cima.</p>';button('Opa. Que história é essa?',()=>show(1),'phone-ring');startTyping();screen.insertAdjacentHTML('beforeend','<p class="note">leva 1 minutinho · zero perguntas de matemática</p>')}
if(n===1){screen.classList.add('photo-scene');screen.innerHTML='<p class="eyebrow">Pesquisa de interesse público</p><h1>Tu gosta de<br>tirar <em>foto?</em></h1><p>Responde com sinceridade.<br>O cidadão que fez esse site está anotando.</p>';const answer=t=>{screen.innerHTML='<div class="bigemoji">📸</div><p class="eyebrow">Informação importantíssima</p><h1>'+t+'</h1>';typeOnce(button('Essa foi péssima. Continua. 😂',()=>show(2)))};button('📸 Sim, inclusive várias',()=>answer('Ótimo, porque eu tô querendo <em>sair contigo.</em>'));button('🙈 Não sou muito de foto',()=>answer('Perfeito. Nosso date <em>não precisa de provas.</em>'),'secondary')}
if(n===2){screen.innerHTML='<p class="eyebrow">Verificação nada imparcial</p><h1>Prove que tu<br>não é um <em>robô.</em></h1><p>Selecione tudo que tu merece:</p><div class="choices"></div>';const grid=screen.querySelector('.choices');[['🍣','Sushi'],['❤️','Muito carinho'],['🥢','Mais sushi'],['🤡','Um cidadão fazendo um site']].forEach(([e,t])=>{let b=document.createElement('button');b.className='choice';b.setAttribute('aria-pressed','false');b.innerHTML='<span aria-hidden="true">'+e+'</span>'+t;b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');grid.append(b)});button('Verificar minha humanidade',()=>{if(!grid.querySelector('[aria-pressed=true]')){document.querySelector('#hint').textContent='Pode escolher. A autoestima é por conta da casa.';return}screen.innerHTML='<div class="bigemoji">✅</div><p class="eyebrow">Verificação concluída</p><h1>Humana.<br>E merecedora<br>de um <em>jantar.</em></h1><p>Carol, tu canta na igreja. Eu canto vantagem porque vou sair contigo. 🎤<br><small>Resultado emitido por um sistema com claros conflitos de interesse.</small></p>';button('Eu sabia',()=>show(3))});screen.insertAdjacentHTML('beforeend','<p class="note" id="hint"></p>')}
if(n===3){noCount=0;screen.innerHTML='<p class="eyebrow">Agora, totalmente por acaso…</p><h1>Tu aceita<br>sair <em>comigo?</em></h1><p id="no-message">Tu já disse sim. Mas eu fiz um site, então finge surpresa.</p>';button('SIM, inclusive tô com fome',()=>show(4));const arena=document.createElement('div');arena.className='arena';const no=document.createElement('button');no.className='secondary spoken no-pulse';no.textContent='Não';arena.append(no);screen.append(arena);no.onclick=()=>{noCount++;const lines=['Acho que teu dedo escorregou.','Esse botão está perdendo os argumentos.','O não entrou na Black Friday: 90% menor.','A opção “não” foi embora. Só sobrou uma opção. Coincidência?'];document.querySelector('#no-message').textContent=lines[Math.min(noCount-1,3)];if(noCount>=4){no.remove();arena.innerHTML='<p class="gone">o não saiu do grupo 👋</p>';screen.querySelector('button').focus()}else{no.style.transform=`translateX(${noCount%2?40:-40}px) scale(${[1,.8,.6,.35][noCount]})`}};button('Falando sério, melhor outro dia ❤️',()=>show(7),'small')}
if(n===4){screen.innerHTML='<p class="eyebrow">Argumentos cuidadosamente selecionados</p><h1>Uma proposta<br>com <em>fundamento.</em></h1><div class="argument"><p>🍣 Tem sushi.</p><p>🥢 Tem reposição de sushi.</p><p>🧍 Tem eu.</p><p><small>Mas vamos focar nos pontos fortes:<br>tem sushi.</small></p></div><p>Mini Festival Oriental no Réchaud: hot, makis, sunomono, yakisoba… e salmão pra melhorar a conversa.</p><p class="note" style="text-align:left;margin:0 0 20px">Reposição livre dos itens oferecidos, com limite de 6 niguiris, 6 gunkans e 6 sashimis por pessoa.</p>';button('Tá. Isso ficou muito interessante.',()=>show(5))}
if(n===5){screen.innerHTML='<p class="eyebrow">Zero novidades. Muito esforço.</p><h1>Já tava marcado.<br>Eu só quis fazer <em>um drama.</em></h1><div class="receipt"><h2>RÉCHAUD 🍣</h2><div class="sub">UM JANTAR COM SEGUNDAS INTENÇÕES</div><div class="rule"></div><p><strong>Pedido:</strong> Mini Festival Oriental</p><p><strong>Companhia:</strong> o responsável por tudo isso aqui.</p><p><strong>Missão:</strong> jantar contigo e tentar não passar vergonha com o hashi.</p><div class="rule"></div><p>Local? Tu já sabe. Dia e hora? Também.<br>Precisava de um site? Não.<br>Eu fiz mesmo assim? Obviamente.</p><div class="stamp">RESERVA CONFIRMADA</div></div>';button('Bora, meu reserva-mesas ❤️',()=>show(6));button('Melhor combinar outro dia',()=>show(7),'small')}
if(n===6){screen.innerHTML='<p class="eyebrow">Departamento de expectativas</p><h1>O date tá certo.<br>Falta o teu <em>parecer.</em></h1><p>Depois desse investimento em tecnologia e vergonha, o cidadão merece umas palavras.</p><label for="recado">Deixa um recadinho pro responsável por isso aqui:</label><textarea id="recado" maxlength="500" placeholder="Pode elogiar, cobrar sushi ou julgar minhas piadas…"></textarea><p id="write-status" class="note" style="margin:0 0 15px">O bilhete fica só nesta tela. Nada é enviado automaticamente.</p>';const input=screen.querySelector('textarea');input.value=window.dateNote||'';input.oninput=()=>window.dateNote=input.value;button('Pronto. Tá escrito ❤️',()=>{const value=input.value.trim();if(!value){document.querySelector('#write-status').textContent='Pelo menos uma palavrinha. Até “socorro” vale.';input.focus();return}screen.innerHTML='<p class="eyebrow">Parecer oficialmente emitido</p><h1>Agora sim.<br>Pode vir o <em>date.</em></h1><div class="letter-card"><h2>Pro cidadão que fez esse site…</h2><p class="written"></p><div class="sunflower" aria-label="Um girassol para Carol">🌻</div><p class="signature">Com carinho, Carol ♡</p><p class="note">OPERAÇÃO SUSHI · UM DATE COM A CAROL</p></div><p>Tu leva esse sorriso. Eu levo a fome e umas piadas melhores.<br><small>(A segunda parte eu não garanto.)</small></p>';screen.querySelector('.written').textContent=value;addNoteActions(value);button('Editar meu bilhete',()=>show(6),'small');confetti()})}
if(n===7){screen.innerHTML='<div class="bigemoji">❤️</div><p class="eyebrow">Sem problema nenhum</p><h1>A gente combina<br><em>outro dia.</em></h1><p>A piada é com o botão, não com tua vontade. Me chama e a gente se entende.</p>';button('Voltar para o convite',()=>show(3))}
window.scrollTo({top:0,behavior:'instant'});const heading=screen.querySelector('h1');heading.tabIndex=-1;heading.focus({preventScroll:true})}
function startTyping(){
const el=screen.querySelector('.scribble'),text='isso aqui é uma indireta...',motion=matchMedia('(prefers-reduced-motion: reduce)');
if(motion.matches)return;
let count=0,deleting=false;el.textContent='';
function tick(){
if(!el.isConnected)return;
if(motion.matches){el.textContent=text;return}
count+=deleting?-1:1;el.textContent=text.slice(0,count);
let delay=180;
if(count===text.length){deleting=true;delay=1500}
else if(count===0){deleting=false;delay=600}
else if(deleting){delay=22}
typingTimer=setTimeout(tick,delay);
}
typingTimer=setTimeout(tick,500);
}

function typeOnce(b){
 const text=b.textContent;b.setAttribute('aria-label',text);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 b.textContent='';const wrap=document.createElement('span');wrap.className='typing-label';wrap.setAttribute('aria-hidden','true');
 const reserve=document.createElement('span');reserve.className='reserve';reserve.textContent=text;
 const ink=document.createElement('span');ink.className='ink';wrap.append(reserve,ink);b.append(wrap);
 const letters=Array.from(text);let i=0;
 function tick(){if(!b.isConnected)return;ink.textContent=letters.slice(0,++i).join('');if(i<letters.length)setTimeout(tick,85)}setTimeout(tick,300);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=b.getBoundingClientRect(),x=e.detail?e.clientX:r.left+r.width/2,y=e.detail?e.clientY:r.top+r.height/2;
 for(let i=0;i<5;i++){const heart=document.createElement('span');heart.className='floating-heart';heart.setAttribute('aria-hidden','true');heart.textContent=['💗','💕','❤️','💖','🤍'][i];heart.style.left=(x+(i-2)*17)+'px';heart.style.top=y+'px';heart.style.setProperty('--drift',((i-2)*35)+'px');heart.style.animationDelay=i*.09+'s';document.body.append(heart);setTimeout(()=>heart.remove(),3500)}
},true);
async function makeNoteImage(value){
 await document.fonts.ready;
 const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=1080;
 ctx.font='48px Caveat, "Segoe Print", cursive';const lines=[];
 for(const paragraph of value.split('\n')){let line='';for(const ch of Array.from(paragraph)){if(ctx.measureText(line+ch).width>850){lines.push(line);line=ch}else line+=ch}lines.push(line)}
 c.height=Math.max(1100,570+lines.length*66);ctx.fillStyle='#172218';ctx.fillRect(0,0,c.width,c.height);
 ctx.save();ctx.translate(65,70);ctx.fillStyle='#faf4df';ctx.fillRect(0,0,950,c.height-140);
 ctx.strokeStyle='#cdd6bd';ctx.lineWidth=1;for(let y=190;y<c.height-230;y+=66){ctx.beginPath();ctx.moveTo(44,y);ctx.lineTo(906,y);ctx.stroke()}
 ctx.fillStyle='#d7ed9a';ctx.fillRect(355,-16,240,44);ctx.fillStyle='#273a2a';ctx.font='bold 56px Caveat, "Segoe Print", cursive';ctx.fillText('Pro cidadão que fez esse site…',45,112);
 ctx.font='48px Caveat, "Segoe Print", cursive';lines.forEach((line,i)=>ctx.fillText(line,50,183+i*66));
 ctx.save();ctx.translate(475,c.height-370);ctx.strokeStyle='#66803d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,57);ctx.stroke();ctx.fillStyle='#78954b';ctx.beginPath();ctx.ellipse(15,39,21,9,-.5,0,Math.PI*2);ctx.fill();for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6);ctx.fillStyle=i%2?'#f4b62f':'#f7ce4c';ctx.beginPath();ctx.ellipse(0,-31,12,25,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#68432b';ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#aa7842';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(Math.sin(i*2.4)*i*1.8,Math.cos(i*2.4)*i*1.8,2,0,Math.PI*2);ctx.fill()}ctx.restore();
 ctx.textAlign='right';ctx.font='52px Caveat, "Segoe Print", cursive';ctx.fillText('Com carinho, Carol ♡',885,c.height-260);
 ctx.textAlign='center';ctx.font='20px Arial';ctx.fillStyle='#53674f';ctx.fillText('OPERAÇÃO SUSHI · UM DATE COM A CAROL',475,c.height-190);ctx.restore();
 return new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('Não foi possível gerar o bilhete')),'image/png'));
}
function addNoteActions(value){
 let blob,url;const status=document.createElement('p');status.className='note';status.textContent='Preparando teu bilhete em imagem…';
 const save=button('Salvar meu bilhete 🖼️',()=>{const a=document.createElement('a');a.href=url;a.download='bilhete-da-carol.png';a.click();status.textContent='Imagem pronta! Se o celular abrir uma prévia, toque e segure para salvar. Também vale print.'});save.disabled=true;
 const share=button('Mandar a imagem 💌',async()=>{try{const file=new File([blob],'bilhete-da-carol.png',{type:'image/png'});await navigator.share({files:[file],title:'Bilhete da Carol'})}catch(err){if(err.name!=='AbortError')status.textContent='Salva a imagem e manda pela conversa. Também vale tirar um print.'}},'secondary');share.hidden=true;screen.append(status);
 makeNoteImage(value).then(result=>{blob=result;url=URL.createObjectURL(blob);save.disabled=false;const file=new File([blob],'bilhete-da-carol.png',{type:'image/png'});share.hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));status.textContent='Salva a imagem ou tira um print e manda pro cidadão. Ele vai querer ler.'}).catch(()=>{save.hidden=true;status.textContent='Não consegui gerar a imagem aqui. Mas o bilhete tá pronto pra tirar um print.'});
}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<25;i++){const el=document.createElement('span');el.className='confetti';el.setAttribute('aria-hidden','true');el.textContent=['🍣','❤️','✨','🥢'][i%4];el.style.left=Math.random()*95+'%';el.style.animationDelay=Math.random()*1.1+'s';document.body.append(el);setTimeout(()=>el.remove(),4300)}}
document.querySelector('#restart').onclick=()=>show(0);show(0);
</script></body></html>
